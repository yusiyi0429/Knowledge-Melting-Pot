spring:
  application:
    name: knowledge-melting-pot-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowledge_melting_pot}
    username: ${SPRING_DATASOURCE_USERNAME:kmp}
    password: ${SPRING_DATASOURCE_PASSWORD:kmp-local-only}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        name: KMP_SESSION
        http-only: true
        same-site: strict
        secure: ${KMP_SECURE_COOKIES:false}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

workbench:
  bootstrap-admin:
    username: ${KMP_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${KMP_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    secure-cookies: ${KMP_SECURE_COOKIES:false}
