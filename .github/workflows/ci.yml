name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Validate OpenAPI
        run: pnpm --package=@redocly/cli@1.34.3 dlx redocly lint contracts/openapi.yaml
      - name: Validate Compose model
        env:
          # Deterministic non-production value used only to validate the Compose model.
          KMP_BOOTSTRAP_ADMIN_PASSWORD: ci-compose-validation-only
          KMP_MODEL_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose -f deploy/compose/compose.yaml config --quiet

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Verify agent runtime boundary
        run: scripts/validate-code-boundaries.sh
      - name: Verify dependency convergence
        run: ./mvnw -f backend/pom.xml org.apache.maven.plugins:maven-enforcer-plugin:3.5.0:enforce -Denforcer.rules=dependencyConvergence -DskipTests
      - name: Build and test
        run: ./mvnw -f backend/pom.xml clean verify
      - name: Generate aggregate SBOM
        run: ./mvnw -f backend/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DskipTests
      - name: Upload aggregate SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-cyclonedx-sbom
          path: |
            backend/target/bom.json
            backend/target/bom.xml
          if-no-files-found: error
          retention-days: 14

  container-images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/compose/${{ matrix.service }}.Dockerfile
          push: false
          load: true
          tags: knowledge-melting-pot-${{ matrix.service }}:ci
          cache-from: type=gha,scope=kmp-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=kmp-${{ matrix.service }}
      - name: Scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: knowledge-melting-pot-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '1'
          ignore-unfixed: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm --dir frontend audit --prod --audit-level high
      - name: Lint
        run: pnpm --dir frontend lint
      - name: Typecheck
        run: pnpm --dir frontend typecheck
      - name: Test
        run: pnpm --dir frontend test
      - name: Build
        run: pnpm --dir frontend build
      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Browser E2E
        run: pnpm --dir frontend test:e2e
