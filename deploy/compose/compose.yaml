name: knowledge-melting-pot

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${KMP_DB_NAME:-knowledge_melting_pot}
      POSTGRES_USER: ${KMP_DB_USER:-kmp}
      POSTGRES_PASSWORD: ${KMP_DB_PASSWORD:-kmp-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KMP_DB_USER:-kmp} -d ${KMP_DB_NAME:-knowledge_melting_pot}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  evaluation-worker:
    profiles: [evaluation]
    build:
      context: ../..
      dockerfile: deploy/compose/worker.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${KMP_DB_NAME:-knowledge_melting_pot}
      SPRING_DATASOURCE_USERNAME: ${KMP_DB_USER:-kmp}
      SPRING_DATASOURCE_PASSWORD: ${KMP_DB_PASSWORD:-kmp-local-only}
      SPRING_FLYWAY_ENABLED: "false"
      WORKBENCH_WORKER_ID: evaluation-worker-${HOSTNAME:-local}
      WORKBENCH_WORKER_MAX_CONCURRENCY: ${KMP_EVALUATION_CONCURRENCY:-2}
      WORKBENCH_WORKER_ACCEPTED_TYPES: "EVALUATE"
      KMP_AGENT_ENABLED: ${KMP_EVALUATION_AGENT_ENABLED:-false}
      KMP_AGENT_TEST_STUB_ENABLED: ${KMP_EVALUATION_TEST_STUB_ENABLED:-false}
      KMP_SKILL_SANDBOX_ENABLED: ${KMP_SKILL_SANDBOX_ENABLED:-false}
      KMP_SKILL_SANDBOX_URL: http://skill-sandbox:8081/v1/execute
      KMP_MODEL_MASTER_KEY_FILE: /run/secrets/kmp_model_master_key
      KMP_ALLOWED_MODEL_HOSTS: ${KMP_ALLOWED_MODEL_HOSTS:-api.openai.com,dashscope.aliyuncs.com}
    secrets: [kmp_model_master_key]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${KMP_EVALUATION_MEMORY_LIMIT:-1g}
    cpus: ${KMP_EVALUATION_CPU_LIMIT:-1.0}
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    depends_on:
      api: { condition: service_healthy }
      postgres: { condition: service_healthy }
    stop_grace_period: 45s
    networks: [backend, edge, sandbox]

  skill-sandbox:
    profiles: [skill-sandbox]
    build:
      context: ../..
      dockerfile: deploy/compose/sandbox.Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test: ["CMD", "python", "-I", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sandbox]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${KMP_MINIO_ROOT_USER:-kmp-local}
      MINIO_ROOT_PASSWORD: ${KMP_MINIO_ROOT_PASSWORD:-kmp-local-only}
      # Local browser uploads (Vite dev/preview + API ports). Exact origins only,
      # never wildcard. This MinIO release supports only this CORS key.
      MINIO_API_CORS_ALLOW_ORIGIN: ${KMP_MINIO_CORS_ALLOW_ORIGIN:-http://localhost:8088,http://localhost:5173,http://localhost:4173,http://127.0.0.1:8088,http://127.0.0.1:5173,http://127.0.0.1:4173}
    volumes:
      - object-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    volumes:
      - ./minio-init.sh:/init/minio-init.sh:ro
    environment:
      MINIO_ROOT_USER: ${KMP_MINIO_ROOT_USER:-kmp-local}
      MINIO_ROOT_PASSWORD: ${KMP_MINIO_ROOT_PASSWORD:-kmp-local-only}
      MC_CONFIG_DIR: /tmp/.mc
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks: [backend]

  clamav:
    image: clamav/clamav:1.4.5-debian13-slim
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [backend]

  api:
    build:
      context: ../..
      dockerfile: deploy/compose/api.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: compose
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${KMP_DB_NAME:-knowledge_melting_pot}
      SPRING_DATASOURCE_USERNAME: ${KMP_DB_USER:-kmp}
      SPRING_DATASOURCE_PASSWORD: ${KMP_DB_PASSWORD:-kmp-local-only}
      WORKBENCH_OBJECT_STORAGE_ENABLED: "true"
      WORKBENCH_OBJECT_STORAGE_INTERNAL_ENDPOINT: http://minio:9000
      WORKBENCH_OBJECT_STORAGE_PUBLIC_ENDPOINT: ${KMP_MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      WORKBENCH_OBJECT_STORAGE_REGION: us-east-1
      WORKBENCH_OBJECT_STORAGE_ACCESS_KEY: ${KMP_MINIO_ROOT_USER:-kmp-local}
      WORKBENCH_OBJECT_STORAGE_SECRET_KEY: ${KMP_MINIO_ROOT_PASSWORD:-kmp-local-only}
      WORKBENCH_OBJECT_STORAGE_PATH_STYLE: "true"
      KMP_BOOTSTRAP_ADMIN_USERNAME: ${KMP_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KMP_SECURE_COOKIES: ${KMP_SECURE_COOKIES:-true}
      KMP_MODEL_MASTER_KEY_FILE: /run/secrets/kmp_model_master_key
      KMP_ALLOWED_MODEL_HOSTS: ${KMP_ALLOWED_MODEL_HOSTS:-api.openai.com,dashscope.aliyuncs.com}
      KMP_MODEL_TEST_CONNECT_TIMEOUT: ${KMP_MODEL_TEST_CONNECT_TIMEOUT:-PT5S}
      KMP_MODEL_TEST_REQUEST_TIMEOUT: ${KMP_MODEL_TEST_REQUEST_TIMEOUT:-PT10S}
      KMP_MODEL_TEST_MAX_REDIRECTS: ${KMP_MODEL_TEST_MAX_REDIRECTS:-2}
      KMP_EMBEDDING_REQUEST_TIMEOUT: ${KMP_EMBEDDING_REQUEST_TIMEOUT:-PT1M}
      KMP_EMBEDDING_MAX_RESPONSE_BYTES: ${KMP_EMBEDDING_MAX_RESPONSE_BYTES:-16777216}
    secrets:
      - source: kmp_bootstrap_admin_password
        target: workbench.bootstrap-admin.password
      - kmp_model_master_key
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${KMP_API_MEMORY_LIMIT:-1g}
    cpus: ${KMP_API_CPU_LIMIT:-1.0}
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [backend, edge]

  worker:
    build:
      context: ../..
      dockerfile: deploy/compose/worker.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${KMP_DB_NAME:-knowledge_melting_pot}
      SPRING_DATASOURCE_USERNAME: ${KMP_DB_USER:-kmp}
      SPRING_DATASOURCE_PASSWORD: ${KMP_DB_PASSWORD:-kmp-local-only}
      SPRING_FLYWAY_ENABLED: "false"
      WORKBENCH_OBJECT_STORAGE_ENABLED: "true"
      WORKBENCH_OBJECT_STORAGE_INTERNAL_ENDPOINT: http://minio:9000
      WORKBENCH_OBJECT_STORAGE_PUBLIC_ENDPOINT: ${KMP_MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      WORKBENCH_OBJECT_STORAGE_REGION: us-east-1
      WORKBENCH_OBJECT_STORAGE_ACCESS_KEY: ${KMP_MINIO_ROOT_USER:-kmp-local}
      WORKBENCH_OBJECT_STORAGE_SECRET_KEY: ${KMP_MINIO_ROOT_PASSWORD:-kmp-local-only}
      WORKBENCH_OBJECT_STORAGE_PATH_STYLE: "true"
      WORKBENCH_CONTENT_CLAMAV_ENABLED: "true"
      WORKBENCH_CONTENT_CLAMAV_HOST: clamav
      WORKBENCH_CONTENT_CLAMAV_PORT: "3310"
      WORKBENCH_CONTENT_OCR_ENABLED: ${KMP_OCR_ENABLED:-true}
      WORKBENCH_CONTENT_OCR_LANGUAGES: ${KMP_OCR_LANGUAGES:-chi_sim+eng}
      WORKBENCH_CONTENT_OCR_DPI: ${KMP_OCR_DPI:-200}
      WORKBENCH_CONTENT_OCR_MAX_PAGES: ${KMP_OCR_MAX_PAGES:-100}
      WORKBENCH_CONTENT_OCR_MAX_TOTAL_PIXELS: ${KMP_OCR_MAX_TOTAL_PIXELS:-200000000}
      WORKBENCH_CONTENT_OCR_PAGE_TIMEOUT: ${KMP_OCR_PAGE_TIMEOUT:-PT45S}
      WORKBENCH_CONTENT_OCR_MAX_OUTPUT_CHARS: ${KMP_OCR_MAX_OUTPUT_CHARS:-5000000}
      WORKBENCH_MATERIAL_INGEST_ENABLED: "true"
      WORKBENCH_WORKER_ACCEPTED_TYPES: "INGEST,EXTRACT,REEXTRACT,ALIGN,GENERATE_ASSET,GENERATE_ALL,SCENE_EXPLORE"
      KMP_AGENT_ENABLED: "false"
      KMP_AGENT_TEST_STUB_ENABLED: ${KMP_AGENT_TEST_STUB_ENABLED:-false}
      KMP_MODEL_MASTER_KEY_FILE: /run/secrets/kmp_model_master_key
      KMP_ALLOWED_MODEL_HOSTS: ${KMP_ALLOWED_MODEL_HOSTS:-api.openai.com,dashscope.aliyuncs.com}
      KMP_EMBEDDING_REQUEST_TIMEOUT: ${KMP_EMBEDDING_REQUEST_TIMEOUT:-PT1M}
      KMP_EMBEDDING_MAX_RESPONSE_BYTES: ${KMP_EMBEDDING_MAX_RESPONSE_BYTES:-16777216}
    secrets: [kmp_model_master_key]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 384
    mem_limit: ${KMP_WORKER_MEMORY_LIMIT:-2g}
    cpus: ${KMP_WORKER_CPU_LIMIT:-2.0}
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    depends_on:
      api: { condition: service_healthy }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    stop_grace_period: 45s
    networks: [backend, edge]

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/web.Dockerfile
    ports:
      - "${KMP_WEB_PORT:-8088}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${KMP_WEB_MEMORY_LIMIT:-128m}
    cpus: ${KMP_WEB_CPU_LIMIT:-0.5}
    init: true
    tmpfs:
      - /run/nginx:rw,noexec,nosuid,nodev,size=4m,uid=101,gid=101,mode=0750
      - /var/lib/nginx/tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0750
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]

volumes:
  postgres-data:
  object-data:
  clamav-data:

networks:
  backend:
    internal: true
  edge:
  sandbox:
    internal: true

secrets:
  kmp_bootstrap_admin_password:
    environment: KMP_BOOTSTRAP_ADMIN_PASSWORD
  kmp_model_master_key:
    environment: KMP_MODEL_MASTER_KEY
