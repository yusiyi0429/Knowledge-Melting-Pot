openapi: 3.1.0
info:
  title: Knowledge Melting Pot API
  version: 1.0.0
  description: Versioned API for auditable knowledge extraction and publication.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/csrf:
    get:
      summary: Issue the CSRF token used by browser mutation requests
      security: []
      operationId: getCsrfToken
      responses:
        '200':
          description: CSRF token metadata; the matching XSRF-TOKEN cookie is also set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/Problem'
  /auth/login:
    post:
      summary: Log in with an administrator-managed account
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Authenticated; the server sets the session cookie.
        '401':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      summary: Invalidate the current session
      operationId: logout
      responses:
        '204':
          description: Session invalidated.
        '401':
          $ref: '#/components/responses/Problem'
  /auth/me:
    get:
      summary: Get the current user and roles
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
  /auth/password:
    post:
      summary: Change the current user's password and revoke all of their sessions
      operationId: changeCurrentUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed; all sessions are invalidated and the user must sign in again.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /users:
    get:
      summary: List administrator-managed local accounts
      operationId: listUsers
      responses:
        '200':
          description: Local accounts without password hashes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      summary: Create a local account with a mandatory first-login password change
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update a local account's display name, activation state, or roles
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated account; role or activation changes revoke existing sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /users/{userId}/password-reset:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Reset a user's password and require a first-login change
      description: >-
        ADMIN only. The new password is write-only and is never logged. The account must change its
        password at the next login and all of its sessions are revoked. An administrator cannot reset
        their own password here and must use the change-password flow instead.
      operationId: resetUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetUserPasswordRequest'
      responses:
        '204':
          description: Password reset; the account must change it at next login and its sessions are revoked.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /scenes:
    get:
      summary: List scenes visible in the shared workspace
      operationId: listScenes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Scene page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenePage'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      summary: Create a scene
      operationId: createScene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSceneRequest'
      responses:
        '201':
          description: Created scene.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '400':
          $ref: '#/components/responses/Problem'
  /scenes/{sceneId}:
    parameters:
      - $ref: '#/components/parameters/SceneId'
    get:
      summary: Get a scene
      operationId: getScene
      responses:
        '200':
          description: Scene details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      summary: Replace mutable scene metadata
      operationId: updateScene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSceneRequest'
      responses:
        '200':
          description: Updated scene.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      summary: Delete a scene that has not entered a protected release workflow
      operationId: deleteScene
      responses:
        '204':
          description: Scene deleted.
        '404':
          $ref: '#/components/responses/Problem'
  /scenes/{sceneId}/subscenes:
    parameters:
      - $ref: '#/components/parameters/SceneId'
    get:
      summary: List subscenes in a scene
      operationId: listSubScenes
      responses:
        '200':
          description: Subscenes ordered by creation time.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubScene' }
        '404':
          $ref: '#/components/responses/Problem'
    post:
      summary: Add a subscene
      operationId: createSubScene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubSceneRequest'
      responses:
        '201':
          description: Created subscene.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubScene'
        '400':
          $ref: '#/components/responses/Problem'
  /scenes/{sceneId}/rounds:
    parameters:
      - $ref: '#/components/parameters/SceneId'
    get:
      summary: List extraction rounds for every subscene in a scene
      operationId: listExtractionRounds
      responses:
        '200':
          description: Extraction rounds ordered by creation time.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExtractionRound' }
        '404':
          $ref: '#/components/responses/Problem'
    post:
      summary: Create the next extraction round for a subscene
      operationId: createExtractionRound
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExtractionRoundRequest'
      responses:
        '201':
          description: Created extraction round.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionRound'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /materials:
    get:
      summary: List materials bound to a round and sub-scene for the workbench
      description: >-
        Returns safe workbench rows for every material status, including PENDING_UPLOAD, UPLOADED, SCANNING,
        FAILED and INACTIVE. Object keys, hashes, object-storage credentials, and presigned URLs are never
        included; the round must belong to the requested sub-scene.
      operationId: listMaterials
      parameters:
        - name: roundId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: subSceneId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Safe workbench material rows with their current binding.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaterialListItem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /explorations:
    get:
      summary: List recent scene exploration sessions
      operationId: listExplorations
      responses:
        '200':
          description: Recent sessions ordered by update time.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExplorationSession' } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create an isolated scene exploration staging session
      operationId: createExploration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties: { title: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '201':
          description: Draft exploration created; ETag contains its acceptance baseline.
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ExplorationSession' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /explorations/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get staging materials, immutable candidates and acceptance lineage
      operationId: getExploration
      responses:
        '200':
          description: Complete exploration state.
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ExplorationDetail' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /explorations/{sessionId}/analysis-jobs:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Freeze ready staging materials and run the global SCENE_EXPLORER configuration
      operationId: startExploration
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedJob' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /explorations/{sessionId}/candidates/{candidateId}/accept:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: candidateId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/IfMatch'
    post:
      summary: Accept one candidate and bind the same staged materials to a new formal round
      operationId: acceptExplorationCandidate
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExplorationAcceptanceRequest' }
      responses:
        '200':
          description: Formal scene lineage and the reused material identifiers.
          content: { application/json: { schema: { $ref: '#/components/schemas/ExplorationAcceptanceResult' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /search:
    get:
      summary: Search scenes, current rule documents and ready source file names
      operationId: searchWorkbench
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Bounded typed search results; document excerpts are capped.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SearchResult' } }
        '400': { $ref: '#/components/responses/Problem' }
  /notifications:
    get:
      summary: Get the current user's durable task notifications
      operationId: listNotifications
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Notification inbox.
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationInbox' } } }
        '401': { $ref: '#/components/responses/Problem' }
  /notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Mark one owned notification read
      operationId: markNotificationRead
      responses:
        '204': { description: Notification marked read. }
        '404': { $ref: '#/components/responses/Problem' }
  /notifications/read:
    patch:
      summary: Mark all current-user notifications read
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: Number of changed rows.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties: { updated: { type: integer, minimum: 0 } }
        '401': { $ref: '#/components/responses/Problem' }
  /materials/upload-intents:
    post:
      summary: Declare a quarantined material upload and report upload capability
      operationId: createUploadIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadIntentRequest'
      responses:
        '201':
          description: Material declaration created. No presigned URL is implied by this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '413':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /materials/upload-intents/{intentId}/complete:
    post:
      summary: Complete a multipart upload and queue ingest validation
      operationId: completeUpload
      parameters:
        - name: intentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedJob'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /materials/upload-intents/{intentId}:
    parameters:
      - name: intentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Abort an upload intent and its multipart upload
      operationId: abortUpload
      responses:
        '204':
          description: Upload intent aborted.
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /materials/{materialId}:
    get:
      summary: Get immutable material metadata and its round bindings
      operationId: getMaterial
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Material metadata and partitioned bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '404':
          $ref: '#/components/responses/Problem'
  /subscenes/{subSceneId}/extraction-jobs:
    post:
      summary: Start a knowledge extraction job
      operationId: startExtraction
      parameters:
        - $ref: '#/components/parameters/SubSceneId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExtractionRequest'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedJob'
        '400':
          $ref: '#/components/responses/Problem'
  /subscenes/{subSceneId}/assets:
    parameters:
      - $ref: '#/components/parameters/SubSceneId'
    get:
      summary: List the latest asset for each type of a sub-scene
      operationId: listAssets
      responses:
        '200':
          description: Latest assets; BLOCKED means the generation prerequisite is missing.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/Problem'
  /assets/{assetId}/download:
    parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Redirect to a short-lived presigned download URL for an immutable asset bundle
      description: Only READY assets can be downloaded; the redirect URL expires in minutes and never exposes object-storage credentials.
      operationId: downloadAsset
      responses:
        '302':
          description: Redirect to a short-lived presigned URL.
        '200':
          description: Resource body after following the redirect (the immutable asset bundle).
        '404':
          $ref: '#/components/responses/Problem'
  /subscenes/{subSceneId}/asset-generation-jobs:
    post:
      summary: Generate one or more knowledge assets
      operationId: generateAssets
      parameters:
        - $ref: '#/components/parameters/SubSceneId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAssetsRequest'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedJob'
        '400':
          $ref: '#/components/responses/Problem'
  /jobs/{jobId}:
    get:
      summary: Get durable job state
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Durable job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/Problem'
  /jobs/{jobId}/events:
    get:
      summary: Stream ordered replayable job events
      operationId: streamJobEvents
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Ordered and replayable job events.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/JobEventEnvelope'
                description: >-
                  SSE frames named stage-started, progress, preview, warning, completed, or failed.
                  Every data field is a serialized JobEventEnvelope and Last-Event-ID is the numeric sequence.
        '404':
          $ref: '#/components/responses/Problem'
  /jobs/{jobId}/cancel:
    post:
      summary: Request cooperative job cancellation
      operationId: cancelJob
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedJob'
        '404':
          $ref: '#/components/responses/Problem'
  /jobs/{jobId}/retry:
    post:
      summary: Retry a failed job
      operationId: retryJob
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedJob'
        '404':
          $ref: '#/components/responses/Problem'
  /knowledge-documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: Get the current knowledge document revision
      operationId: getKnowledgeDocument
      responses:
        '200':
          description: Current document revision.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      summary: Validate and save a new document revision
      operationId: saveKnowledgeDocument
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDocumentRequest'
      responses:
        '200':
          description: Newly created immutable revision.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /knowledge-documents/{documentId}/revisions:
    get:
      summary: List immutable document revisions
      operationId: listDocumentRevisions
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Immutable revision history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentRevisionSummary'
        '404':
          $ref: '#/components/responses/Problem'
  /knowledge-documents/{documentId}/alignment-jobs:
    post:
      summary: Start an AI alignment proposal job
      operationId: startAlignment
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAlignmentRequest'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedJob'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
  /knowledge-documents/{documentId}/alignment-proposals:
    get:
      summary: List immutable alignment proposals for a knowledge document
      operationId: listAlignmentProposals
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Proposals ordered newest first, including typed diff and adoption state.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlignmentProposal' }
        '404':
          $ref: '#/components/responses/Problem'
  /alignment-proposals/{proposalId}:
    get:
      summary: Get an immutable alignment proposal
      operationId: getAlignmentProposal
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Immutable proposal plus separately recorded adoption metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlignmentProposal'
        '404':
          $ref: '#/components/responses/Problem'
  /alignment-proposals/{proposalId}/adopt:
    post:
      summary: Adopt a proposal against its base revision
      operationId: adoptAlignmentProposal
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Proposal applied as a new document revision.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /scenes/{sceneId}/release-validations:
    post:
      summary: Validate cumulative release readiness
      operationId: validateRelease
      parameters:
        - $ref: '#/components/parameters/SceneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReleaseRequest'
      responses:
        '200':
          description: Release readiness report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseValidation'
        '412':
          $ref: '#/components/responses/Problem'
  /scenes/{sceneId}/releases/latest:
    parameters:
      - $ref: '#/components/parameters/SceneId'
    get:
      summary: Get the latest published release of a scene (the current baseline)
      description: Used to seed expectedBaseReleaseId for cumulative releases; 404 when the scene has no published release yet.
      operationId: getLatestRelease
      responses:
        '200':
          description: The latest published release metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '404':
          $ref: '#/components/responses/Problem'
  /scenes/{sceneId}/releases:
    post:
      summary: Publish an immutable cumulative scene release
      operationId: createRelease
      parameters:
        - $ref: '#/components/parameters/SceneId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReleaseRequest'
      responses:
        '201':
          description: Immutable cumulative scene release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
  /releases/{releaseId}:
    get:
      summary: Get immutable release metadata
      operationId: getRelease
      parameters:
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Immutable release metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '404':
          $ref: '#/components/responses/Problem'
  /releases/{releaseId}/manifest:
    get:
      summary: Get an immutable release manifest
      operationId: getReleaseManifest
      parameters:
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Immutable release manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseManifest'
        '404':
          $ref: '#/components/responses/Problem'
  /releases/{releaseId}/subscenes/{subSceneId}/evaluation-jobs:
    post:
      summary: Start a release-bound Holdout evaluation
      description: >-
        Evaluates the QA_EVALUATOR configuration and Skill frozen in the published release.
        Cases are selected only from READY LABELED_HOLDOUT materials in the requested round;
        expected answers are never sent to the model.
      operationId: createEvaluationJob
      parameters:
        - name: releaseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: subSceneId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvaluationRequest'
      responses:
        '202':
          description: Evaluation job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /releases/{releaseId}/subscenes/{subSceneId}/evaluation-runs:
    get:
      summary: List recent evaluation runs for one released sub-scene
      operationId: listEvaluationRuns
      parameters:
        - name: releaseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: subSceneId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Most recent runs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationRun'
        '404':
          $ref: '#/components/responses/Problem'
  /evaluation-runs/{runId}:
    get:
      summary: Get an evaluation run with immutable case evidence
      operationId: getEvaluationRun
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Evaluation aggregate and per-case evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationDetail'
        '404':
          $ref: '#/components/responses/Problem'
  /model-connections:
    get:
      summary: List model connections without exposing credentials
      description: ADMIN only. Credentials and encrypted envelopes are never returned.
      operationId: listModelConnections
      responses:
        '200':
          description: Model connections with write-only credential state represented as a boolean.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelConnection'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      summary: Create a model connection
      description: ADMIN only. The credential is write-only and envelope-encrypted before persistence.
      operationId: createModelConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelConnectionRequest'
      responses:
        '201':
          description: Created model connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConnection'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /model-connections/{modelConnectionId}:
    parameters:
      - $ref: '#/components/parameters/ModelConnectionId'
    get:
      summary: Get a model connection without exposing its credential
      description: ADMIN only.
      operationId: getModelConnection
      responses:
        '200':
          description: Model connection metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConnection'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      summary: Replace mutable model connection metadata
      description: ADMIN only. Omitting credential retains it; clearCredential removes it.
      operationId: updateModelConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelConnectionRequest'
      responses:
        '200':
          description: Updated model connection metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConnection'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      summary: Soft-delete a model connection
      description: ADMIN only. Existing immutable config versions remain available for release traceability.
      operationId: deleteModelConnection
      responses:
        '204':
          description: Model connection disabled and soft-deleted.
        '404':
          $ref: '#/components/responses/Problem'
  /model-connections/{modelConnectionId}/connection-tests:
    parameters:
      - $ref: '#/components/parameters/ModelConnectionId'
    post:
      summary: Revalidate model connection safety policy
      description: ADMIN only. The default implementation performs no external network request and sends no credential.
      operationId: testModelConnection
      responses:
        '200':
          description: Offline safety validation result; this is not proof of provider connectivity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConnectionTestResult'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /model-connections/{modelConnectionId}/config-versions:
    parameters:
      - $ref: '#/components/parameters/ModelConnectionId'
    get:
      summary: List immutable model configuration versions
      description: ADMIN only.
      operationId: listModelConfigVersions
      responses:
        '200':
          description: Versions ordered newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelConfigVersion'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      summary: Append an immutable model configuration version
      description: ADMIN only. Existing versions are never updated in place.
      operationId: createModelConfigVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelConfigVersionRequest'
      responses:
        '201':
          description: Appended immutable model configuration version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfigVersion'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /model-config-versions/{modelConfigVersionId}:
    parameters:
      - $ref: '#/components/parameters/ModelConfigVersionId'
    get:
      summary: Get an immutable model configuration version
      description: ADMIN only.
      operationId: getModelConfigVersion
      responses:
        '200':
          description: Immutable model configuration version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfigVersion'
        '404':
          $ref: '#/components/responses/Problem'
  /skills:
    get:
      summary: List skills (templates and instances) with their latest immutable version
      operationId: listSkills
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SkillKind'
        - name: sceneId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Skills with their latest version; manifests are safe resource-only metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      summary: Create a global TEMPLATE skill with its first immutable version
      description: ADMIN only. The manifest is validated as resource-only JSON metadata and is never executed.
      operationId: createSkill
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSkillRequest'
      responses:
        '201':
          description: Created template with its first version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /skills/{skillId}:
    parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a skill with its immutable version history
      operationId: getSkill
      responses:
        '200':
          description: Skill detail and versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDetail'
        '404':
          $ref: '#/components/responses/Problem'
  /skills/{skillId}/instances:
    parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Fork a scene INSTANCE from a TEMPLATE (OPERATOR/ADMIN)
      description: The instance inherits the template name and its latest version.
      operationId: forkSkillInstance
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
      responses:
        '201':
          description: Created scene instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /skills/{skillId}/versions:
    parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Append a new immutable version to an INSTANCE skill (OPERATOR/ADMIN)
      operationId: createSkillVersion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionRequest'
      responses:
        '201':
          description: Appended immutable version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillVersion'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /agent-roles:
    get:
      summary: List the fixed seven Agent roles
      operationId: listAgentRoles
      responses:
        '200':
          description: Version-independent role catalog.
          content:
            application/json:
              schema:
                type: array
                minItems: 7
                maxItems: 7
                items: { $ref: '#/components/schemas/AgentRoleDefinition' }
        '403': { $ref: '#/components/responses/Problem' }
  /agent-mounts:
    get:
      summary: Get the latest immutable Agent mount head for one scope
      operationId: getAgentMountScope
      parameters:
        - name: scope
          in: query
          required: true
          schema: { $ref: '#/components/schemas/AgentMountScope' }
        - name: scopeId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Scope configuration. The response ETag protects version appends.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentScopeConfiguration' }
        '404': { $ref: '#/components/responses/Problem' }
  /agent-mounts/effective:
    get:
      summary: Resolve Global to Scene to SubScene Agent configuration inheritance
      operationId: resolveAgentMounts
      parameters:
        - name: sceneId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: subSceneId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Seven effective configurations including field sources and lineage hashes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EffectiveAgentConfiguration' }
        '404': { $ref: '#/components/responses/Problem' }
  /agent-mounts/versions:
    post:
      summary: Append one immutable Agent mount version
      operationId: appendAgentMountVersion
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendAgentMountRequest' }
      responses:
        '200':
          description: Updated scope configuration.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentScopeConfiguration' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /agent-configuration-catalog:
    get:
      summary: List safe model and Skill version metadata available for Agent mounts
      operationId: getAgentConfigurationCatalog
      responses:
        '200':
          description: Catalog never contains model endpoints or credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigurationCatalog' }
        '403': { $ref: '#/components/responses/Problem' }
  /configuration-imports/previews:
    post:
      summary: Validate and freeze an Agent configuration import Diff
      operationId: previewConfigurationImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigurationImportRequest' }
      responses:
        '200':
          description: Immutable preview. Use manifestHash as If-Match when applying.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationImportPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /configuration-imports/{importId}:
    get:
      summary: Get an immutable configuration import preview
      operationId: getConfigurationImport
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Frozen manifest and Diff.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationImportPreview' }
        '404': { $ref: '#/components/responses/Problem' }
  /configuration-imports/{importId}/apply:
    post:
      summary: Transactionally append all versions from a frozen configuration import
      operationId: applyConfigurationImport
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Updated scope configuration.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentScopeConfiguration' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /audit-events:
    get:
      summary: List redacted audit events
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Redacted audit event page.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '403':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: KMP_SESSION
  parameters:
    SceneId:
      name: sceneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubSceneId:
      name: subSceneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelConnectionId:
      name: modelConnectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelConfigVersionId:
      name: modelConfigVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  responses:
    AcceptedJob:
      description: Command accepted as a durable job.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcceptedJob'
    Problem:
      description: RFC 7807 problem response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    CsrfToken:
      type: object
      additionalProperties: false
      required: [headerName, parameterName, token]
      properties:
        headerName: { type: string }
        parameterName: { type: string }
        token: { type: string, writeOnly: true }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, initialPassword, roles]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,99}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        initialPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [OPERATOR, PUBLISHER, ADMIN]
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        enabled: { type: boolean }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [OPERATOR, PUBLISHER, ADMIN]
    ResetUserPasswordRequest:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    User:
      type: object
      additionalProperties: false
      required: [id, username, displayName, roles, enabled, mustChangePassword]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [OPERATOR, PUBLISHER, ADMIN]
        enabled: { type: boolean }
        mustChangePassword: { type: boolean }
    Scene:
      type: object
      additionalProperties: false
      required: [id, name, description, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ScenePage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Scene' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    CreateSceneRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
    UpdateSceneRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
    CreateSubSceneRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
    SubScene:
      type: object
      additionalProperties: false
      required: [id, sceneId, name, description, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sceneId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateExtractionRoundRequest:
      type: object
      additionalProperties: false
      required: [subSceneId]
      properties:
        subSceneId: { type: string, format: uuid }
    ExtractionRound:
      type: object
      additionalProperties: false
      required: [id, subSceneId, roundNumber, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        subSceneId: { type: string, format: uuid }
        roundNumber: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [DRAFT, PROCESSING, READY, FAILED, SUPERSEDED]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MaterialPartition:
      type: string
      enum: [SOURCE, LABELED_TRAIN, LABELED_HOLDOUT]
    MaterialShareScope:
      type: string
      enum: [ROUND, SUBSCENE, SCENE]
    CreateUploadIntentRequest:
      type: object
      additionalProperties: false
      required: [fileName, sizeBytes, mediaType, sha256, partition, shareScope]
      oneOf:
        - required: [roundId]
          not: { required: [explorationSessionId] }
        - required: [explorationSessionId]
          not: { required: [roundId] }
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 209715200 }
        mediaType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            - text/plain
        sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        roundId: { type: string, format: uuid }
        explorationSessionId:
          type: string
          format: uuid
          description: Stages a SOURCE material without a Round binding; exactly one scope id is required.
        subSceneIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        partition: { $ref: '#/components/schemas/MaterialPartition' }
        shareScope: { $ref: '#/components/schemas/MaterialShareScope' }
        regulatorySource: { type: boolean, default: false }
    ExplorationSession:
      type: object
      additionalProperties: false
      required: [id, title, status, exploreJobId, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [DRAFT, ANALYZING, READY, ACCEPTED, FAILED, CANCELLED] }
        exploreJobId: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExplorationMaterial:
      type: object
      additionalProperties: false
      required: [id, fileName, format, sizeBytes, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        format: { type: string, enum: [PDF, DOCX, XLSX, TXT] }
        sizeBytes: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/MaterialStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExplorationCandidate:
      type: object
      additionalProperties: false
      required: [id, rank, sceneName, sceneDescription, subSceneName, subSceneDescription, rationale,
        valueLevel, estimatedRuleCount, estimatedFlowCount, tags, materialIds]
      properties:
        id: { type: string, format: uuid }
        rank: { type: integer, minimum: 1, maximum: 5 }
        sceneName: { type: string }
        sceneDescription: { type: string }
        subSceneName: { type: string }
        subSceneDescription: { type: string }
        rationale: { type: string }
        valueLevel: { type: string, enum: [HIGH, MEDIUM, LOW] }
        estimatedRuleCount: { type: integer, minimum: 0 }
        estimatedFlowCount: { type: integer, minimum: 0 }
        tags: { type: array, maxItems: 8, items: { type: string } }
        materialIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } }
    ExplorationAcceptance:
      type: object
      additionalProperties: false
      required: [candidateId, sceneId, subSceneId, roundId, acceptedAt]
      properties:
        candidateId: { type: string, format: uuid }
        sceneId: { type: string, format: uuid }
        subSceneId: { type: string, format: uuid }
        roundId: { type: string, format: uuid }
        acceptedAt: { type: string, format: date-time }
    ExplorationDetail:
      type: object
      additionalProperties: false
      required: [session, etag, materials, candidates, acceptance]
      properties:
        session: { $ref: '#/components/schemas/ExplorationSession' }
        etag: { type: string, pattern: '^[a-f0-9]{64}$' }
        materials: { type: array, items: { $ref: '#/components/schemas/ExplorationMaterial' } }
        candidates: { type: array, items: { $ref: '#/components/schemas/ExplorationCandidate' } }
        acceptance: { anyOf: [{ $ref: '#/components/schemas/ExplorationAcceptance' }, { type: 'null' }] }
    ExplorationAcceptanceRequest:
      type: object
      additionalProperties: false
      properties:
        sceneName: { type: string, maxLength: 200 }
        sceneDescription: { type: string, maxLength: 10000 }
        subSceneName: { type: string, maxLength: 200 }
        subSceneDescription: { type: string, maxLength: 10000 }
    ExplorationAcceptanceResult:
      type: object
      additionalProperties: false
      required: [sceneId, subSceneId, roundId, reusedMaterialIds]
      properties:
        sceneId: { type: string, format: uuid }
        subSceneId: { type: string, format: uuid }
        roundId: { type: string, format: uuid }
        reusedMaterialIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } }
    SearchResult:
      type: object
      additionalProperties: false
      required: [type, sceneId, subSceneId, resourceId, title, excerpt]
      properties:
        type: { type: string, enum: [SCENE, RULE, SOURCE] }
        sceneId: { type: string, format: uuid }
        subSceneId: { type: [string, 'null'], format: uuid }
        resourceId: { type: string, format: uuid }
        title: { type: string }
        excerpt: { type: string, maxLength: 240 }
    Notification:
      type: object
      additionalProperties: false
      required: [id, type, title, message, resourceType, resourceId, createdAt, readAt, read]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        resourceType: { type: string }
        resourceId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
        read: { type: boolean }
    NotificationInbox:
      type: object
      additionalProperties: false
      required: [unreadCount, items]
      properties:
        unreadCount: { type: integer, minimum: 0 }
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
    UploadIntent:
      type: object
      additionalProperties: false
      required:
        - id
        - materialId
        - objectKey
        - materialStatus
        - uploadMode
        - capabilityStatus
        - uploadUrlAvailable
        - maxBytes
        - supportedFormats
        - completionBehavior
        - messageCode
      properties:
        id: { type: string, format: uuid }
        materialId: { type: string, format: uuid }
        objectKey: { type: string }
        materialStatus: { type: string, enum: [PENDING_UPLOAD] }
        uploadMode:
          type: string
          enum: [DECLARATION_ONLY, MULTIPART_PRESIGNED]
        capabilityStatus:
          type: string
          enum: [OBJECT_STORAGE_NOT_CONFIGURED, MULTIPART_PRESIGNED]
        uploadUrlAvailable: { type: boolean }
        maxBytes: { type: integer, format: int64, const: 209715200 }
        supportedFormats:
          type: array
          prefixItems:
            - { type: string, const: pdf }
            - { type: string, const: docx }
            - { type: string, const: xlsx }
            - { type: string, const: txt }
          items: false
        completionBehavior: { type: string, enum: [QUEUES_VALIDATION] }
        messageCode:
          type: string
          enum:
            - material.upload.object-storage-not-configured
            - material.upload.multipart-presigned
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PresignedPartMetadata'
          description: >-
            Ordered part metadata for browsers to PUT directly to object storage. Only present when
            uploadMode is MULTIPART_PRESIGNED; headers exclude the browser-managed Host header.
        partSize:
          type: [integer, 'null']
          format: int64
          minimum: 1
        partCount:
          type: [integer, 'null']
          minimum: 1
        presignedUrls:
          type: array
          items:
            type: string
            format: uri
    PresignedPartMetadata:
      type: object
      additionalProperties: false
      required: [partNumber, url]
      properties:
        partNumber: { type: integer, minimum: 1 }
        url: { type: string, format: uri }
        headers:
          type: object
          additionalProperties: { type: string }
    MaterialListItem:
      type: object
      additionalProperties: false
      required: [id, fileName, format, mediaType, sizeBytes, status, createdAt, updatedAt, binding]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        format: { type: string, enum: [PDF, DOCX, XLSX, TXT] }
        mediaType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 209715200 }
        status: { $ref: '#/components/schemas/MaterialStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        binding: { $ref: '#/components/schemas/MaterialBinding' }
    MaterialBinding:
      type: object
      additionalProperties: false
      required: [id, roundId, subSceneId, partition, shareScope, regulatorySource, active]
      properties:
        id: { type: string, format: uuid }
        roundId: { type: string, format: uuid }
        subSceneId: { type: string, format: uuid }
        partition: { $ref: '#/components/schemas/MaterialPartition' }
        shareScope: { $ref: '#/components/schemas/MaterialShareScope' }
        regulatorySource: { type: boolean }
        active: { type: boolean }
    CompleteUploadRequest:
      type: object
      additionalProperties: false
      properties:
        parts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UploadedPart'
    UploadedPart:
      type: object
      additionalProperties: false
      required: [partNumber, etag]
      properties:
        partNumber: { type: integer, minimum: 1 }
        etag: { type: string, minLength: 1, maxLength: 200 }
    MaterialStatus:
      type: string
      enum: [PENDING_UPLOAD, UPLOADED, SCANNING, READY, FAILED, INACTIVE]
    Material:
      type: object
      additionalProperties: false
      required: [id, fileName, format, mediaType, objectKey, sha256, sizeBytes, status, bindings]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        format: { type: string, enum: [PDF, DOCX, XLSX, TXT] }
        mediaType: { type: string }
        objectKey: { type: string }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 209715200 }
        status: { $ref: '#/components/schemas/MaterialStatus' }
        bindings:
          type: array
          items: { $ref: '#/components/schemas/RoundMaterial' }
    RoundMaterial:
      type: object
      additionalProperties: false
      required: [id, roundId, subSceneId, partition, shareScope, regulatorySource, active]
      properties:
        id: { type: string, format: uuid }
        roundId: { type: string, format: uuid }
        subSceneId: { type: string, format: uuid }
        partition: { $ref: '#/components/schemas/MaterialPartition' }
        shareScope: { $ref: '#/components/schemas/MaterialShareScope' }
        regulatorySource: { type: boolean }
        active: { type: boolean }
    StartExtractionRequest:
      type: object
      additionalProperties: false
      required: [roundId]
      properties:
        roundId: { type: string, format: uuid }
        modelConfigVersionId:
          type: string
          format: uuid
          description: Optional compatibility override; omit together with skillVersionId to use the effective KNOWLEDGE_EXTRACTOR mount.
        skillVersionId:
          type: string
          format: uuid
          description: Optional compatibility override; must be present iff modelConfigVersionId is present.
    AgentRole:
      type: string
      enum: [SCENE_EXPLORER, KNOWLEDGE_EXTRACTOR, ALIGNMENT_REVIEWER, RULE_CATALOG_GENERATOR,
        DECISION_FLOW_GENERATOR, SKILL_PACKAGER, QA_EVALUATOR]
    AgentMountScope:
      type: string
      enum: [GLOBAL, SCENE, SUB_SCENE]
    AgentRoleDefinition:
      type: object
      additionalProperties: false
      required: [role, displayName, stage, description]
      properties:
        role: { $ref: '#/components/schemas/AgentRole' }
        displayName: { type: string }
        stage: { type: string, enum: [环节一, 环节二, 环节三] }
        description: { type: string }
    AgentMountDraft:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/AgentRole' }
        enabled: { type: [boolean, 'null'] }
        modelConfigVersionId: { type: [string, 'null'], format: uuid }
        skillVersionId: { type: [string, 'null'], format: uuid }
        options:
          type: [object, 'null']
          maxProperties: 64
          additionalProperties: true
          description: Non-secret, non-executable runtime options. Null means inherit.
    AppendAgentMountRequest:
      allOf:
        - $ref: '#/components/schemas/AgentMountDraft'
        - type: object
          required: [scope]
          properties:
            scope: { $ref: '#/components/schemas/AgentMountScope' }
            scopeId: { type: [string, 'null'], format: uuid }
    AgentMountVersion:
      type: object
      additionalProperties: false
      required: [id, role, scope, version, configHash, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/AgentRole' }
        scope: { $ref: '#/components/schemas/AgentMountScope' }
        scopeId: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 1 }
        templateVersionId: { type: [string, 'null'], format: uuid }
        enabled: { type: [boolean, 'null'] }
        modelConfigVersionId: { type: [string, 'null'], format: uuid }
        skillVersionId: { type: [string, 'null'], format: uuid }
        optionsJson: { type: [string, 'null'] }
        configHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    AgentScopeConfiguration:
      type: object
      additionalProperties: false
      required: [scope, etag, mounts]
      properties:
        scope: { $ref: '#/components/schemas/AgentMountScope' }
        scopeId: { type: [string, 'null'], format: uuid }
        sceneId: { type: [string, 'null'], format: uuid }
        etag: { type: string, pattern: '^[0-9a-f]{64}$' }
        mounts:
          type: array
          items: { $ref: '#/components/schemas/AgentMountVersion' }
    EffectiveAgentConfiguration:
      type: object
      additionalProperties: false
      required: [role, displayName, stage, enabled, configured, modelConfigVersionId, skillVersionId,
        optionsJson, effectiveHash, effectiveMountVersionId, lineage]
      properties:
        role: { $ref: '#/components/schemas/AgentRole' }
        displayName: { type: string }
        stage: { type: string }
        enabled: { type: boolean }
        configured: { type: boolean }
        modelConfigVersionId: { type: [string, 'null'], format: uuid }
        skillVersionId: { type: [string, 'null'], format: uuid }
        optionsJson: { type: string }
        effectiveHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        effectiveMountVersionId: { type: [string, 'null'], format: uuid }
        enabledSource: { oneOf: [{ $ref: '#/components/schemas/AgentMountScope' }, { type: 'null' }] }
        modelSource: { oneOf: [{ $ref: '#/components/schemas/AgentMountScope' }, { type: 'null' }] }
        skillSource: { oneOf: [{ $ref: '#/components/schemas/AgentMountScope' }, { type: 'null' }] }
        optionsSource: { type: [string, 'null'] }
        lineage:
          type: array
          items: { $ref: '#/components/schemas/AgentMountVersion' }
    AgentConfigurationCatalog:
      type: object
      additionalProperties: false
      required: [models, skills]
      properties:
        models:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [versionId, connectionId, connectionName, provider, version, modelId, temperature, maxOutputTokens]
            properties:
              versionId: { type: string, format: uuid }
              connectionId: { type: string, format: uuid }
              connectionName: { type: string }
              provider: { $ref: '#/components/schemas/ModelProvider' }
              version: { type: integer, minimum: 1 }
              modelId: { type: string }
              temperature: { type: number }
              maxOutputTokens: { type: integer }
        skills:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [versionId, skillId, name, kind, version, packageHash]
            properties:
              versionId: { type: string, format: uuid }
              skillId: { type: string, format: uuid }
              name: { type: string }
              kind: { $ref: '#/components/schemas/SkillKind' }
              sceneId: { type: [string, 'null'], format: uuid }
              version: { type: integer, minimum: 1 }
              packageHash: { type: string, pattern: '^[0-9a-f]{64}$' }
    ConfigurationImportRequest:
      type: object
      additionalProperties: false
      required: [scope, roles]
      properties:
        scope: { $ref: '#/components/schemas/AgentMountScope' }
        scopeId: { type: [string, 'null'], format: uuid }
        roles:
          type: array
          minItems: 1
          maxItems: 7
          items: { $ref: '#/components/schemas/AgentMountDraft' }
    ConfigurationImportPreview:
      type: object
      additionalProperties: false
      required: [id, schemaVersion, scope, baseEtag, manifestJson, manifestHash, diffJson, createdBy, createdAt, applied]
      properties:
        id: { type: string, format: uuid }
        schemaVersion: { type: string, const: '1.0' }
        scope: { $ref: '#/components/schemas/AgentMountScope' }
        scopeId: { type: [string, 'null'], format: uuid }
        sceneId: { type: [string, 'null'], format: uuid }
        baseEtag: { type: string, pattern: '^[0-9a-f]{64}$' }
        manifestJson: { type: string }
        manifestHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        diffJson: { type: string }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        appliedBy: { type: [string, 'null'], format: uuid }
        appliedAt: { type: [string, 'null'], format: date-time }
        applied: { type: boolean }
    SkillKind:
      type: string
      enum: [TEMPLATE, INSTANCE]
    CreateSkillRequest:
      type: object
      additionalProperties: false
      required: [name, manifest, packageHash]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        manifest:
          type: string
          description: >-
            Safe resource-only JSON metadata (resources/prompt/schema/files).
            Must declare executionMode RESOURCE_ONLY; scripts, binaries, commands,
            and secrets are rejected and the manifest is never executed.
        packageHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
    CreateInstanceRequest:
      type: object
      additionalProperties: false
      required: [sceneId]
      properties:
        sceneId: { type: string, format: uuid }
    CreateVersionRequest:
      type: object
      additionalProperties: false
      required: [manifest, packageHash]
      properties:
        manifest:
          type: string
          description: Safe resource-only JSON metadata; never executed.
        packageHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
    Skill:
      type: object
      additionalProperties: false
      required: [id, name, kind, description, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/SkillKind' }
        description: { type: string }
        sceneId: { type: [string, 'null'], format: uuid }
        sourceSkillId: { type: [string, 'null'], format: uuid }
        sourceSkillVersionId: { type: [string, 'null'], format: uuid }
        version: { type: [integer, 'null'], minimum: 1 }
        packageHash: { type: [string, 'null'] }
        manifestJson: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    SkillVersion:
      type: object
      additionalProperties: false
      required: [id, skillId, version, manifestJson, packageHash, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        skillId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        manifestJson: { type: string }
        packageHash: { type: string }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    SkillDetail:
      type: object
      additionalProperties: false
      required: [id, name, kind, description, createdAt, versions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/SkillKind' }
        description: { type: string }
        sceneId: { type: [string, 'null'], format: uuid }
        sourceSkillId: { type: [string, 'null'], format: uuid }
        sourceSkillVersionId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SkillVersion'
    AssetType:
      type: string
      enum: [RULE_CATALOG, DECISION_FLOW, SKILL_PACKAGE, QA_PAIRS, EVALUATION_SET]
    AssetStatus:
      type: string
      enum: [PENDING, GENERATING, READY, FAILED, SUPERSEDED, BLOCKED]
    Asset:
      type: object
      additionalProperties: false
      required: [id, subSceneId, type, version, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        subSceneId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/AssetType' }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/AssetStatus' }
        documentRevisionId: { type: [string, 'null'], format: uuid }
        objectKey: { type: string }
        checksum: { type: string }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GenerateAssetsRequest:
      type: object
      additionalProperties: false
      required: [documentRevisionId, types]
      properties:
        documentRevisionId: { type: string, format: uuid }
        types:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/AssetType' }
    StartAlignmentRequest:
      type: object
      additionalProperties: false
      description: Schedules alignment only; document bodies and arbitrary parameters are not accepted.
      required: [baseRevisionId, action, regulatoryMaterialIds]
      properties:
        baseRevisionId: { type: string, format: uuid }
        action:
          type: string
          enum: [CONSISTENCY, REGULATORY, GAP_ANALYSIS, REWRITE]
        regulatoryMaterialIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Required and non-empty only for REGULATORY; every item must be regulatory and non-HOLDOUT.
          items: { type: string, format: uuid }
    AlignmentProposal:
      type: object
      additionalProperties: false
      required: [id, documentId, baseRevisionId, baseEtag, action, status, structuredPatch,
        reason, sourceRefs, regulatoryMaterialIds, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        baseRevisionId: { type: string, format: uuid }
        baseEtag: { type: string }
        action: { type: string, enum: [CONSISTENCY, REGULATORY, GAP_ANALYSIS, REWRITE] }
        status: { type: string, enum: [READY, ADOPTED] }
        structuredPatch: { $ref: '#/components/schemas/KnowledgePatch' }
        reason: { type: string }
        sourceRefs:
          type: array
          items: { $ref: '#/components/schemas/SourceRef' }
        regulatoryMaterialIds:
          type: array
          items: { type: string, format: uuid }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        adoptedRevisionId: { type: [string, 'null'], format: uuid }
        adoptedBy: { type: [string, 'null'], format: uuid }
        adoptedAt: { type: [string, 'null'], format: date-time }
    KnowledgePatch:
      type: object
      additionalProperties: false
      required: [operation, replacement, diff]
      properties:
        operation: { type: string, const: replaceKnowledgeIr }
        replacement: { $ref: '#/components/schemas/KnowledgeIr' }
        diff: { $ref: '#/components/schemas/KnowledgeDiff' }
    KnowledgeDiff:
      type: object
      additionalProperties: false
      required: [addedRuleIds, removedRuleIds, changedRuleIds, addedFlowIds, removedFlowIds,
        changedFlowIds, sourceRefDelta]
      properties:
        addedRuleIds: { type: array, items: { type: string } }
        removedRuleIds: { type: array, items: { type: string } }
        changedRuleIds: { type: array, items: { type: string } }
        addedFlowIds: { type: array, items: { type: string } }
        removedFlowIds: { type: array, items: { type: string } }
        changedFlowIds: { type: array, items: { type: string } }
        sourceRefDelta: { type: integer }
    AcceptedJob:
      type: object
      required: [jobId, status, statusUrl, eventsUrl]
      properties:
        jobId: { type: string, format: uuid }
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        statusUrl: { type: string }
        eventsUrl: { type: string }
        resourceType: { type: [string, 'null'] }
        resourceId: { type: [string, 'null'], format: uuid }
    Job:
      type: object
      required: [id, type, status, attempt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [INGEST, EXTRACT, REEXTRACT, ALIGN, GENERATE_ASSET, GENERATE_ALL, SCENE_EXPLORE, EVALUATE]
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        stage: { type: [string, 'null'] }
        percent: { type: integer, minimum: 0, maximum: 100 }
        attempt: { type: integer, minimum: 0 }
        errorCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    JobEventEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, sequence, jobId, stage, percent, messageCode, traceId, timestamp, message]
      properties:
        eventId: { type: string, pattern: '^[0-9]+$' }
        sequence: { type: integer, format: int64, minimum: 0 }
        jobId: { type: string, format: uuid }
        stage: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        percent: { type: integer, minimum: 0, maximum: 100 }
        messageCode:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,128}$'
          description: >
            Stable machine-readable code. Ingest jobs emit the diagnostic
            EMBEDDING_PROVIDER_UNCONFIGURED when no real embedding provider is
            configured; vectors are never fabricated and no EMBEDDINGS_COMMITTED
            stage is reported in that state.
        traceId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
        timestamp: { type: string, format: date-time }
        message: { type: string }
    SourceRef:
      type: object
      additionalProperties: false
      description: >
        A source reference derived exclusively from the persisted chunk locator
        and material identity. Client input never contributes to these fields.
      required: [code, materialId, materialSha256, chunkId, locatorType, excerptHash]
      properties:
        code: { type: string, pattern: '^SRC-[A-Za-z0-9_-]{1,100}$' }
        materialId: { type: string, format: uuid }
        materialSha256: { type: string }
        chunkId: { type: string, format: uuid }
        locatorType:
          type: string
          enum: [PDF_PAGE_PARAGRAPH, DOCX_PARAGRAPH, DOCX_TABLE_CELL, XLSX_RANGE, TXT_LINES]
        page: { type: [integer, 'null'], minimum: 1 }
        paragraph: { type: [integer, 'null'], minimum: 0 }
        table: { type: [integer, 'null'], minimum: 0 }
        sheet: { type: [string, 'null'] }
        rowStart: { type: [integer, 'null'], minimum: 0 }
        rowEnd: { type: [integer, 'null'], minimum: 0 }
        colStart: { type: [integer, 'null'], minimum: 0 }
        colEnd: { type: [integer, 'null'], minimum: 0 }
        lineStart: { type: [integer, 'null'], minimum: 0 }
        lineEnd: { type: [integer, 'null'], minimum: 0 }
        excerptHash: { type: string }
    KnowledgeIr:
      type: object
      additionalProperties: false
      required: [schemaVersion, metadata, rules, flows, conflicts, gaps, sourceRefs]
      properties:
        schemaVersion: { type: string, const: knowledge-ir/v1 }
        metadata:
          type: object
          additionalProperties: false
          required: [documentId, subSceneId, roundId, inputHash]
          properties:
            documentId: { type: string, format: uuid }
            subSceneId: { type: string, format: uuid }
            roundId: { type: string, format: uuid }
            inputHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        rules:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeRule' }
        flows:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeFlow' }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeConflict' }
        gaps:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeGap' }
        sourceRefs:
          type: array
          items: { $ref: '#/components/schemas/SourceRef' }
    KnowledgeRule:
      type: object
      additionalProperties: false
      required: [id, title, condition, conclusion, priority, exceptions, sourceRefs]
      properties:
        id: { type: string, pattern: '^R-[a-f0-9]{16}$' }
        title: { type: string }
        condition: { type: string }
        conclusion: { type: string }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        exceptions: { type: array, items: { type: string } }
        sourceRefs:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: '^SRC-[A-Za-z0-9_-]{1,100}$' }
    KnowledgeFlow:
      type: object
      additionalProperties: false
      required: [id, name, nodes, edges]
      properties:
        id: { type: string }
        name: { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeFlowNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeFlowEdge' }
    KnowledgeFlowNode:
      type: object
      additionalProperties: false
      required: [id, label, critical, sourceRefs]
      properties:
        id: { type: string }
        label: { type: string }
        critical: { type: boolean }
        sourceRefs:
          type: array
          uniqueItems: true
          items: { type: string, pattern: '^SRC-[A-Za-z0-9_-]{1,100}$' }
    KnowledgeFlowEdge:
      type: object
      additionalProperties: false
      required: [id, source, target, label]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        label: { type: string }
    KnowledgeConflict:
      type: object
      additionalProperties: false
      required: [id, description, sourceRefs]
      properties:
        id: { type: string }
        description: { type: string }
        sourceRefs:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: '^SRC-[A-Za-z0-9_-]{1,100}$' }
    KnowledgeGap:
      type: object
      additionalProperties: false
      required: [id, description]
      properties:
        id: { type: string }
        description: { type: string }
    KnowledgeDocument:
      type: object
      required: [id, subSceneId, revisionId, revisionNumber, contentMd, contentHash, sourceRefs, etag]
      properties:
        id: { type: string, format: uuid }
        subSceneId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        revisionNumber: { type: integer, minimum: 1 }
        contentMd: { type: string }
        contentHash: { type: string }
        finalized: { type: boolean }
        sourceRefs:
          type: array
          items: { $ref: '#/components/schemas/SourceRef' }
        etag: { type: string }
    SaveDocumentRequest:
      type: object
      additionalProperties: false
      required: [contentMd, finalize]
      properties:
        subSceneId:
          type: [string, 'null']
          format: uuid
          description: Required only when creating the first revision.
        contentMd: { type: string, minLength: 1 }
        revisionNote: { type: string, maxLength: 500 }
        finalize: { type: boolean, default: false }
    DocumentRevisionSummary:
      type: object
      additionalProperties: false
      required: [id, revisionNumber, contentHash, createdBy, finalized, createdAt]
      properties:
        id: { type: string, format: uuid }
        revisionNumber: { type: integer }
        contentHash: { type: string }
        note: { type: [string, 'null'] }
        createdBy: { type: string, format: uuid }
        finalized: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateReleaseRequest:
      type: object
      additionalProperties: false
      required: [tag, selectedSubSceneIds, note, confirmed, expectedBaseReleaseId]
      properties:
        tag: { type: string, pattern: '^v[0-9]+\.[0-9]+(?:\.[0-9]+)?$' }
        selectedSubSceneIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        note: { type: string, minLength: 1, maxLength: 2000 }
        expectedBaseReleaseId: { type: [string, 'null'], format: uuid }
        confirmed: { type: boolean, const: true }
    ReleaseValidation:
      type: object
      required: [ready, coverage, baseReleaseId, selected, carriedForward, missing, blockers, warnings]
      properties:
        ready: { type: boolean }
        coverage: { type: string, enum: [PARTIAL, FULL] }
        baseReleaseId: { type: [string, 'null'], format: uuid }
        selected:
          type: array
          items: { type: string, format: uuid }
        carriedForward:
          type: array
          items: { type: string, format: uuid }
        missing:
          type: array
          items: { type: string, format: uuid }
        blockers:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
    Release:
      type: object
      required: [id, sceneId, tag, coverage, note, previousReleaseId, manifestSha256, createdAt]
      properties:
        id: { type: string, format: uuid }
        sceneId: { type: string, format: uuid }
        tag: { type: string }
        coverage: { type: string, enum: [PARTIAL, FULL] }
        note: { type: string }
        previousReleaseId: { type: [string, 'null'], format: uuid }
        manifestSha256: { type: string }
        createdAt: { type: string, format: date-time }
    ReleaseManifest:
      type: object
      description: The sha256 field hashes the canonical JSON representation with the sha256 property omitted.
      required: [schemaVersion, releaseId, sceneId, tag, coverage, note, generatedAt, previousReleaseId, subScenes, sha256]
      properties:
        schemaVersion: { type: string, const: '1.0' }
        releaseId: { type: string, format: uuid }
        sceneId: { type: string, format: uuid }
        tag: { type: string }
        coverage: { type: string, enum: [PARTIAL, FULL] }
        note: { type: string }
        generatedAt: { type: string, format: date-time }
        previousReleaseId: { type: [string, 'null'], format: uuid }
        subScenes:
          type: array
          items:
            type: object
            required: [subSceneId, status, assets, agentConfigurations]
            properties:
              subSceneId: { type: string, format: uuid }
              status: { type: string, enum: [SELECTED, CARRIED_FORWARD, MISSING] }
              sourceReleaseId: { type: [string, 'null'], format: uuid }
              documentRevisionId: { type: [string, 'null'], format: uuid }
              assets:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [assetId, assetType, assetVersion, documentRevisionId, objectKey, checksum]
                  properties:
                    assetId: { type: string, format: uuid }
                    assetType:
                      type: string
                      enum: [RULE_CATALOG, DECISION_FLOW, SKILL_PACKAGE, QA_PAIRS, EVALUATION_SET]
                    assetVersion: { type: integer, minimum: 1 }
                    documentRevisionId: { type: string, format: uuid }
                    objectKey: { type: string }
                    checksum: { type: string }
              agentConfigurations:
                type: array
                description: Immutable seven-role configuration snapshot; carried-forward sub-scenes retain the prior release snapshot.
                items:
                  type: object
                  required: [role, enabled, effectiveHash, lineage]
                  properties:
                    role: { $ref: '#/components/schemas/AgentRole' }
                    enabled: { type: boolean }
                    effectiveHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                    effectiveMountVersionId: { type: [string, 'null'], format: uuid }
                    model: { type: [object, 'null'] }
                    skill: { type: [object, 'null'] }
                    lineage:
                      type: array
                      items:
                        type: object
                        required: [mountVersionId, scope, version, configHash]
                        properties:
                          mountVersionId: { type: string, format: uuid }
                          scope: { $ref: '#/components/schemas/AgentMountScope' }
                          version: { type: integer, minimum: 1 }
                          templateVersionId: { type: [string, 'null'], format: uuid }
                          configHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        sha256: { type: string }
    CreateEvaluationRequest:
      type: object
      additionalProperties: false
      required: [roundId]
      properties:
        roundId: { type: string, format: uuid }
    EvaluationAccepted:
      type: object
      additionalProperties: false
      required: [evaluationRunId, jobId, status, statusUrl, eventsUrl]
      properties:
        evaluationRunId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        statusUrl: { type: string }
        eventsUrl: { type: string }
    EvaluationRun:
      type: object
      additionalProperties: false
      required: [id, releaseId, subSceneId, roundId, documentRevisionId, evaluationAssetId,
        skillAssetId, modelConfigVersionId, skillVersionId, jobId, caseSetHash, status,
        totalCases, passedCases, failedCases, errorCases, failureCode, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        releaseId: { type: string, format: uuid }
        subSceneId: { type: string, format: uuid }
        roundId: { type: string, format: uuid }
        documentRevisionId: { type: string, format: uuid }
        evaluationAssetId: { type: string, format: uuid }
        skillAssetId: { type: string, format: uuid }
        modelConfigVersionId: { type: string, format: uuid }
        skillVersionId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        caseSetHash:
          type: string
          pattern: '^(?:|[0-9a-f]{64})$'
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        totalCases: { type: integer, minimum: 0 }
        passedCases: { type: integer, minimum: 0 }
        failedCases: { type: integer, minimum: 0 }
        errorCases: { type: integer, minimum: 0 }
        accuracy: { type: [number, 'null'], minimum: 0, maximum: 1 }
        failureCode: { type: string, maxLength: 100 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    EvaluationCase:
      type: object
      additionalProperties: false
      required: [id, ordinal, caseKey, input, expected, materialId, chunkId, sourceRefCode,
        tags, prediction, outcome, errorCode, latencyMillis]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 0 }
        caseKey: { type: string, minLength: 1, maxLength: 120 }
        input: { type: string, minLength: 1, maxLength: 20000 }
        expected: { type: string, minLength: 1, maxLength: 500 }
        materialId: { type: string, format: uuid }
        chunkId: { type: string, format: uuid }
        sourceRefCode: { type: string }
        tags:
          type: array
          maxItems: 16
          items: { type: string, minLength: 1, maxLength: 80 }
        prediction: { type: [string, 'null'], maxLength: 500 }
        outcome: { type: [string, 'null'], enum: [PASSED, FAILED, ERROR, null] }
        errorCode: { type: [string, 'null'], maxLength: 100 }
        latencyMillis: { type: [integer, 'null'], minimum: 0, maximum: 3600000 }
    EvaluationDetail:
      type: object
      additionalProperties: false
      required: [run, cases]
      properties:
        run: { $ref: '#/components/schemas/EvaluationRun' }
        cases:
          type: array
          items: { $ref: '#/components/schemas/EvaluationCase' }
    ModelProvider:
      type: string
      enum: [OPENAI_COMPATIBLE, DASHSCOPE]
    ModelConnectionValidationStatus:
      type: string
      enum: [UNTESTED, CONFIGURATION_VALIDATED]
    ModelConnection:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - provider
        - baseUrl
        - enabled
        - credentialConfigured
        - validationStatus
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        provider: { $ref: '#/components/schemas/ModelProvider' }
        baseUrl: { type: string, format: uri, pattern: '^https://' }
        enabled: { type: boolean }
        credentialConfigured:
          type: boolean
          description: Indicates only whether a credential exists; the credential and envelope are never readable.
        validationStatus: { $ref: '#/components/schemas/ModelConnectionValidationStatus' }
        lastValidatedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateModelConnectionRequest:
      type: object
      additionalProperties: false
      required: [name, provider, baseUrl, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        provider: { $ref: '#/components/schemas/ModelProvider' }
        baseUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
          description: Must exactly match an administrator-maintained host whitelist and resolve only to public addresses.
        credential:
          type: string
          maxLength: 8192
          writeOnly: true
        enabled: { type: boolean }
    UpdateModelConnectionRequest:
      type: object
      additionalProperties: false
      required: [name, provider, baseUrl, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        provider: { $ref: '#/components/schemas/ModelProvider' }
        baseUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
          description: Must exactly match an administrator-maintained host whitelist and resolve only to public addresses.
        credential:
          type: string
          maxLength: 8192
          writeOnly: true
        clearCredential:
          type: boolean
          default: false
          description: Cannot be true when credential is supplied.
        enabled: { type: boolean }
    CreateModelConfigVersionRequest:
      type: object
      additionalProperties: false
      required: [modelId, temperature, maxOutputTokens]
      properties:
        modelId: { type: string, minLength: 1, maxLength: 300 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxOutputTokens: { type: integer, minimum: 1, maximum: 1000000 }
    ModelConfigVersion:
      type: object
      additionalProperties: false
      required: [id, modelConnectionId, version, modelId, temperature, maxOutputTokens, createdAt]
      properties:
        id: { type: string, format: uuid }
        modelConnectionId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        modelId: { type: string }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxOutputTokens: { type: integer, minimum: 1, maximum: 1000000 }
        createdAt: { type: string, format: date-time }
    ModelConnectionTestResult:
      type: object
      additionalProperties: false
      required:
        - status
        - networkAttempted
        - connectivityVerified
        - credentialConfigured
        - messageCode
        - testedAt
      properties:
        status: { type: string, const: CONFIGURATION_VALIDATED }
        networkAttempted: { type: boolean, const: false }
        connectivityVerified: { type: boolean, const: false }
        credentialConfigured: { type: boolean }
        messageCode: { type: string, const: model.configuration.validated-offline }
        testedAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actorId, action, targetType, targetId, detailsJson, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string, format: uuid }
        detailsJson: { type: string, description: "Server-redacted audit details; clients render only allowlisted fields." }
        traceId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
